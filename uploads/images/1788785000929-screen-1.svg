      <stop offset="0%" stop-color="#15803D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#052E16" stop-opacity="1"/>
    </radialGradient>
    <rect width="400" height="700" rx="36" fill="url(#fq1-radial)"/>
    
    <!-- Phone Top Status Bar -->
